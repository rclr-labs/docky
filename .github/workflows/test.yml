name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check . --exit-zero
        echo "✅ Ruff linting completed (non-blocking)"

    - name: Format check with black
      run: |
        black --check . || echo "⚠️ Code formatting issues found (non-blocking)"

    - name: Type check with mypy
      run: |
        mypy ingest api llm --no-error-summary 2>&1 | head -20 || true
        echo "✅ MyPy type checking completed (non-blocking)"

    - name: Run tests with coverage
      run: |
        pytest --cov=ingest --cov=api --cov=llm --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
        verbose: true

    - name: Generate coverage badge
      run: |
        coverage-badge -o coverage.svg -f
      continue-on-error: true

    - name: Comment PR with coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const coverage = require('child_process')
            .execSync('coverage json --data-file=.coverage && cat coverage.json | python -c "import sys, json; print(json.load(sys.stdin)[\"totals\"][\"percent_covered\"])"')
            .toString()
            .trim();
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `### Test Results\n\nCoverage: ${coverage}%`
          });
      continue-on-error: true

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort mypy

    - name: Run ruff
      run: ruff check .

    - name: Run black
      run: black --check .

    - name: Run isort
      run: isort --check-only .

    - name: Run mypy
      run: mypy ingest api llm --strict

  security:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip bandit safety

    - name: Run bandit
      run: bandit -r ingest api llm -f json -o bandit-report.json || true

    - name: Check dependencies with safety
      run: safety check --json --continue-on-error || true
